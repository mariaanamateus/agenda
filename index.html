<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Social Media — Maio 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fdf9f6;--surface:#fffcfa;--border:#ece6de;--text:#2a2118;--muted:#a09488;
  --pink:#f7d4d4;--pink-d:#c47070;
  --lilac:#ddd0ef;--lilac-d:#8a67b0;
  --yellow:#f5e9c0;--yellow-d:#c4a030;
  --green:#cce8cc;--green-d:#4e9a55;
  --blue:#ccdff0;--blue-d:#4478b0;
  --peach:#f5dac8;--peach-d:#c47840;
  --done:#4e9a55;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* NAV TABS */
.nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 20px;}
.nav-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:0;justify-content:space-between;}
.nav-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;padding:16px 0;white-space:nowrap;}
.nav-title em{font-style:italic;color:var(--muted);font-weight:400;}
.tabs{display:flex;gap:2px;}
.tab{background:none;border:none;padding:14px 16px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab.active{color:var(--text);border-bottom-color:var(--text);}

/* PROGRESS */
.prog-wrap{background:var(--border);height:3px;}
.prog-bar{height:100%;background:linear-gradient(90deg,#a8d5a2,#7ab5d4);transition:width .6s ease;}

/* FILTERS */
.filters{max-width:960px;margin:16px auto 0;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap;}
.fbtn{border:1.5px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:11px;font-family:'Jost',sans-serif;font-weight:500;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;}
.fbtn.active,.fbtn:hover{background:var(--text);color:#fff;border-color:var(--text);}

/* VIEWS */
.view{display:none;max-width:960px;margin:0 auto;padding:20px 20px 100px;}
.view.active{display:block;}

/* LIST VIEW */
.wgroup{margin-bottom:32px;}
.wlabel{font-family:'Cormorant Garamond',serif;font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.dgroup{margin-bottom:16px;}
.dheader{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.dname{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;min-width:28px;}
.ddate{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;}
.dline{flex:1;height:1px;background:var(--border);}
.tasks{display:flex;flex-direction:column;gap:6px;}

.card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 13px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc,var(--border));}
.card:hover{border-color:#ccc;transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,0,0,.05);}
.card.done{opacity:.5;}
.card.done .ctitle{text-decoration:line-through;color:var(--muted);}
.card.done::before{background:var(--done)!important;}
.cw{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .2s;}
.card.done .cw{background:var(--done);border-color:var(--done);}
.ci{opacity:0;color:#fff;font-size:10px;}
.card.done .ci{opacity:1;}
.cc{flex:1;min-width:0;}
.ctitle{font-size:13px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmeta{display:flex;gap:4px;flex-wrap:wrap;}
.tag{font-size:10px;font-weight:500;padding:1px 7px;border-radius:99px;white-space:nowrap;}
.tt{background:var(--peach);color:var(--peach-d);}
.tp{background:var(--yellow);color:var(--yellow-d);}
.tx{background:var(--blue);color:var(--blue-d);}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
.delbtn{flex-shrink:0;background:none;border:none;color:var(--border);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;transition:color .2s;display:none;}
.card:hover .delbtn{display:block;}
.delbtn:hover{color:var(--pink-d);}

/* CLIENT COLORS */
.c-rei{background:var(--pink);color:var(--pink-d);}
.c-med{background:var(--lilac);color:var(--lilac-d);}
.c-qui{background:var(--yellow);color:var(--yellow-d);}
.c-rep{background:var(--peach);color:var(--peach-d);}
.c-vs1{background:var(--green);color:var(--green-d);}
.c-vs2{background:var(--blue);color:var(--blue-d);}
.c-uph{background:var(--pink);color:var(--pink-d);}
.c-upg{background:var(--lilac);color:var(--lilac-d);}
.c-eco{background:var(--green);color:var(--green-d);}
.c-jun{background:var(--yellow);color:var(--yellow-d);}
.c-custom{background:var(--blue);color:var(--blue-d);}
.card[data-c="rei"]{--cc:var(--pink-d);}
.card[data-c="med"]{--cc:var(--lilac-d);}
.card[data-c="qui"]{--cc:var(--yellow-d);}
.card[data-c="rep"]{--cc:var(--peach-d);}
.card[data-c="vs1"]{--cc:var(--green-d);}
.card[data-c="vs2"]{--cc:var(--blue-d);}
.card[data-c="uph"]{--cc:var(--pink-d);}
.card[data-c="upg"]{--cc:var(--lilac-d);}
.card[data-c="eco"]{--cc:var(--green-d);}
.card[data-c="jun"]{--cc:var(--yellow-d);}
.card[data-c="custom"]{--cc:var(--blue-d);}

/* CALENDAR VIEW */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{font-size:10px;font-weight:600;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:6px 0;}
.cal-day{min-height:80px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:6px;cursor:pointer;transition:all .2s;position:relative;}
.cal-day:hover{border-color:#bbb;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-day.today{border-color:var(--text);border-width:2px;}
.cal-day-num{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px;}
.cal-day.today .cal-day-num{color:var(--text);}
.cal-dots{display:flex;flex-direction:column;gap:2px;}
.cal-dot{font-size:9px;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.cal-dot.done-dot{opacity:.4;text-decoration:line-through;}
.cal-more{font-size:9px;color:var(--muted);margin-top:2px;}

/* DAY MODAL */
.day-modal-overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(42,33,24,.35);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center;padding:0;}
.day-modal-overlay.open{display:flex;}
.day-modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:70vh;overflow-y:auto;padding:24px 20px 40px;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.day-modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.day-modal-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;}
.day-modal-tasks{display:flex;flex-direction:column;gap:8px;}

/* REPORT VIEW */
.report-header{margin-bottom:28px;}
.report-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;margin-bottom:4px;}
.report-sub{font-size:13px;color:var(--muted);}
.report-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;line-height:1;}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500;}
.report-section{margin-bottom:24px;}
.report-section-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.report-client-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.report-client-row:last-child{border-bottom:none;}
.report-client-name{font-size:13px;font-weight:500;flex:1;}
.report-bar-wrap{flex:2;background:var(--border);border-radius:99px;height:6px;overflow:hidden;}
.report-bar{height:100%;border-radius:99px;background:var(--green-d);transition:width .8s ease;}
.report-nums{font-size:12px;color:var(--muted);white-space:nowrap;min-width:70px;text-align:right;}
.report-pct{font-size:12px;font-weight:600;min-width:36px;text-align:right;}
.report-tipo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.report-tipo-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
.report-tipo-icon{font-size:18px;}
.report-tipo-info{flex:1;}
.report-tipo-name{font-size:12px;font-weight:500;}
.report-tipo-count{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--text);}
.report-empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 0;font-style:italic;}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;z-index:200;width:50px;height:50px;border-radius:50%;background:var(--text);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.fab:hover{transform:scale(1.08);}

/* ADD MODAL */
.overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(42,33,24,.38);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:20px;padding:26px 22px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.modal h2{font-family:'Cormorant Garamond',serif;font-size:20px;margin-bottom:18px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px;}
.fg input,.fg select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Jost',sans-serif;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s;}
.fg input:focus,.fg select:focus{border-color:#aaa;}
.mactions{display:flex;gap:8px;margin-top:18px;}
.bcancel{flex:1;padding:10px;border-radius:9px;border:1.5px solid var(--border);background:transparent;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;color:var(--muted);}
.bsave{flex:2;padding:10px;border-radius:9px;border:none;background:var(--text);color:#fff;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:#fff;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:500;z-index:999;transition:transform .3s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:48px 0;font-style:italic;}

@media(max-width:600px){
  .nav{padding:0 14px;}
  .tab{padding:12px 10px;font-size:12px;}
  .view{padding:16px 14px 90px;}
  .filters{padding:0 14px;}
  .report-summary{grid-template-columns:repeat(3,1fr);}
  .report-tipo-grid{grid-template-columns:1fr 1fr;}
  .cal-grid{gap:2px;}
  .cal-day{min-height:60px;padding:4px;}
  .cal-dot{font-size:8px;}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <div class="nav-title">Agenda <em>Social</em></div>
    <div class="tabs">
      <button class="tab active" data-view="list">📋 Lista</button>
      <button class="tab" data-view="cal">🗓️ Calendário</button>
      <button class="tab" data-view="report">📊 Relatório</button>
    </div>
  </div>
</div>
<div class="prog-wrap"><div class="prog-bar" id="pb" style="width:0%"></div></div>

<div class="filters" id="filters">
  <button class="fbtn active" data-f="all">Todos</button>
  <button class="fbtn" data-f="rei">Rei do Camarão</button>
  <button class="fbtn" data-f="med">Mediterra</button>
  <button class="fbtn" data-f="qui">Quiosque Girassol</button>
  <button class="fbtn" data-f="rep">Repool</button>
  <button class="fbtn" data-f="vs1">Villa do Sol I</button>
  <button class="fbtn" data-f="vs2">Villa do Sol II</button>
  <button class="fbtn" data-f="uph">UPH</button>
  <button class="fbtn" data-f="upg">UPG</button>
  <button class="fbtn" data-f="eco">ECO</button>
  <button class="fbtn" data-f="jun">Jundus</button>
  <button class="fbtn" data-f="custom">➕ Extras</button>
</div>

<!-- LIST VIEW -->
<div class="view active" id="view-list"></div>

<!-- CALENDAR VIEW -->
<div class="view" id="view-cal">
  <div class="cal-header">
    <div class="cal-title">Maio 2026</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- REPORT VIEW -->
<div class="view" id="view-report"></div>

<!-- DAY MODAL -->
<div class="day-modal-overlay" id="dayOverlay">
  <div class="day-modal">
    <div class="day-modal-title">
      <span id="dayModalTitle"></span>
      <button class="day-modal-close" id="dayModalClose">×</button>
    </div>
    <div class="day-modal-tasks" id="dayModalTasks"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Novo compromisso</h2>
    <div class="fg"><label>Data</label><input type="date" id="fDate" min="2026-05-01" max="2026-12-31"></div>
    <div class="fg"><label>Cliente</label>
      <select id="fClient">
        <option value="rei">Rei do Camarão</option><option value="med">Mediterra</option>
        <option value="qui">Quiosque Girassol</option><option value="rep">Repool</option>
        <option value="vs1">Villa do Sol I</option><option value="vs2">Villa do Sol II</option>
        <option value="uph">UPH</option><option value="upg">UPG</option>
        <option value="eco">ECO</option><option value="jun">Jundus</option>
        <option value="custom">Outro</option>
      </select>
    </div>
    <div class="fg"><label>Tarefa</label><input type="text" id="fTipo" placeholder="Ex: Reunião, Carrossel..."></div>
    <div class="fg"><label>Observação (opcional)</label><input type="text" id="fPrazo" placeholder="Ex: Até 19h"></div>
    <div class="mactions">
      <button class="bcancel" id="mcancel">Cancelar</button>
      <button class="bsave" id="msave">Salvar</button>
    </div>
  </div>
</div>

<button class="fab" id="fab">+</button>
<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const CL={
  rei:{name:'Rei do Camarão',cls:'c-rei',color:'#f7d4d4',dc:'#c47070'},
  med:{name:'Mediterra',cls:'c-med',color:'#ddd0ef',dc:'#8a67b0'},
  qui:{name:'Quiosque Girassol',cls:'c-qui',color:'#f5e9c0',dc:'#c4a030'},
  rep:{name:'Repool',cls:'c-rep',color:'#f5dac8',dc:'#c47840'},
  vs1:{name:'Villa do Sol I',cls:'c-vs1',color:'#cce8cc',dc:'#4e9a55'},
  vs2:{name:'Villa do Sol II',cls:'c-vs2',color:'#ccdff0',dc:'#4478b0'},
  uph:{name:'UPH',cls:'c-uph',color:'#f7d4d4',dc:'#c47070'},
  upg:{name:'UPG',cls:'c-upg',color:'#ddd0ef',dc:'#8a67b0'},
  eco:{name:'ECO',cls:'c-eco',color:'#cce8cc',dc:'#4e9a55'},
  jun:{name:'Jundus',cls:'c-jun',color:'#f5e9c0',dc:'#c4a030'},
  custom:{name:'Extra',cls:'c-custom',color:'#ccdff0',dc:'#4478b0'},
};
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS=['Jan','Fev','Mar','Abr','Maio','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const WD=[4,5,6,7,8,11,12,13,14,15,18,19,20,21,22,25,26,27,28,29];
function ds(d){return`2026-05-${String(d).padStart(2,'0')}`;}
let _i=0;
function tk(date,client,tipo,prazo=''){return{id:'p'+(_i++),date,client,tipo,prazo,preset:true};}

const PRESET=[
  ...[5,12,19,26].map(d=>tk(ds(d),'rei','Carrossel','Até 19h')),
  ...[7,14,21,28].map(d=>tk(ds(d),'rei','Reels','Até 19h')),
  ...WD.map(d=>tk(ds(d),'rei','Stories','Hr. almoço')),
  ...WD.map(d=>tk(ds(d),'rei','Resposta Google','')),
  ...[5,12,19,26].map(d=>tk(ds(d),'med','Carrossel','Até 19h')),
  ...[7,14,21,28].map(d=>tk(ds(d),'med','Reels','Até 19h')),
  ...WD.map(d=>tk(ds(d),'med','Stories','Hr. almoço')),
  ...[6,13,20,27].map(d=>tk(ds(d),'qui','Carrossel','Até 19h')),
  ...[8,15,22,29].map(d=>tk(ds(d),'qui','Reels','Até 19h')),
  ...WD.map(d=>tk(ds(d),'qui','Stories','Hr. almoço')),
  ...[5,19].map(d=>tk(ds(d),'rep','Carrossel','')),
  ...[12,26].map(d=>tk(ds(d),'rep','Reels','')),
  ...WD.flatMap(d=>[tk(ds(d),'rep','Stories',''),tk(ds(d),'rep','Stories','')]),
  ...[6,20].map(d=>tk(ds(d),'vs1','Post','')),
  ...[6,13,20,27].flatMap(d=>[tk(ds(d),'vs1','Stories',''),tk(ds(d),'vs1','Stories','')]),
  ...[7,21].map(d=>tk(ds(d),'vs2','Post','')),
  ...[7,14,21,28].flatMap(d=>[tk(ds(d),'vs2','Stories',''),tk(ds(d),'vs2','Stories','')]),
  ...[4,6,8,11,13,15,18,20,22,25,27,29].map(d=>tk(ds(d),'uph','Post','')),
  ...WD.flatMap(d=>[tk(ds(d),'uph','Stories',''),tk(ds(d),'uph','Stories','')]),
  ...[5,7,12,14,19,21,26,28].map(d=>tk(ds(d),'upg','Post','')),
  ...WD.flatMap(d=>[tk(ds(d),'upg','Stories',''),tk(ds(d),'upg','Stories','')]),
  ...[4,6,8,11,13,15,18,20,22,25,27,29].map(d=>tk(ds(d),'eco','Post','')),
  ...WD.flatMap(d=>[tk(ds(d),'eco','Stories',''),tk(ds(d),'eco','Stories','')]),
  ...WD.map(d=>tk(ds(d),'jun','Resposta Google','')),
];

const SK_D='ag_done_maio26', SK_C='ag_cust_maio26';
let done=JSON.parse(localStorage.getItem(SK_D)||'{}');
let custom=JSON.parse(localStorage.getItem(SK_C)||'[]');
let filter='all', activeView='list';

function save(){localStorage.setItem(SK_D,JSON.stringify(done));localStorage.setItem(SK_C,JSON.stringify(custom));}
function all(){return[...PRESET,...custom];}
function filtered(){return filter==='all'?all():all().filter(t=>t.client===filter);}

function weekLbl(d){
  const n=new Date(d+'T12:00:00').getDate();
  if(n<=8)return'Semana 1 — 04 a 08 de Maio';
  if(n<=15)return'Semana 2 — 11 a 15 de Maio';
  if(n<=22)return'Semana 3 — 18 a 22 de Maio';
  return'Semana 4 — 25 a 29 de Maio';
}
function fmt(d){const dt=new Date(d+'T12:00:00');return{day:DAYS[dt.getDay()],full:`${dt.getDate()} de ${MONTHS[dt.getMonth()]}`};}

// ── LIST RENDER ───────────────────────────────────────────────────────────────
function renderList(){
  const el=document.getElementById('view-list');
  const tasks=filtered();
  if(!tasks.length){el.innerHTML='<p class="empty">Nenhuma tarefa encontrada.</p>';return;}
  const byWeek={};
  tasks.forEach(t=>{const w=weekLbl(t.date);if(!byWeek[w])byWeek[w]={};if(!byWeek[w][t.date])byWeek[w][t.date]=[];byWeek[w][t.date].push(t);});
  let h='';
  for(const[w,days]of Object.entries(byWeek)){
    h+=`<div class="wgroup"><div class="wlabel">${w}</div>`;
    for(const date of Object.keys(days).sort()){
      const{day,full}=fmt(date);
      h+=`<div class="dgroup"><div class="dheader"><span class="dname">${day}</span><span class="ddate">${full}</span><div class="dline"></div></div><div class="tasks">`;
      days[date].forEach(t=>{h+=cardHTML(t);});
      h+=`</div></div>`;
    }
    h+=`</div>`;
  }
  el.innerHTML=h;
  updateProg();
}

function cardHTML(t){
  const dn=!!done[t.id],c=CL[t.client]||CL.custom,isCust=!t.preset;
  return`<div class="card ${dn?'done':''}" data-c="${t.client}" data-id="${t.id}" onclick="toggle('${t.id}')">
    <div class="cw"><span class="ci">✓</span></div>
    <div class="cc">
      <div class="ctitle">${t.tipo}${t.prazo?' · '+t.prazo:''}</div>
      <div class="cmeta">
        <span class="tag tt">${t.tipo}</span>
        ${t.prazo?`<span class="tag tp">⏰ ${t.prazo}</span>`:''}
        ${isCust?`<span class="tag tx">➕ extra</span>`:''}
      </div>
    </div>
    <span class="badge ${c.cls}">${c.name}</span>
    ${isCust?`<button class="delbtn" onclick="del(event,'${t.id}')">×</button>`:''}
  </div>`;
}

// ── CALENDAR RENDER ───────────────────────────────────────────────────────────
function renderCal(){
  const grid=document.getElementById('calGrid');
  // Day of week headers
  let h=DAYS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  // May 2026: May 1 = Friday (index 5)
  const firstDow=5;
  for(let i=0;i<firstDow;i++)h+=`<div class="cal-day empty"></div>`;
  const tasks=filtered();
  const today=new Date();
  for(let d=1;d<=31;d++){
    const dateStr=ds(d);
    const dayTasks=tasks.filter(t=>t.date===dateStr);
    const isToday=today.getFullYear()===2026&&today.getMonth()===4&&today.getDate()===d;
    const doneCnt=dayTasks.filter(t=>done[t.id]).length;
    const dots=dayTasks.slice(0,3).map(t=>{
      const c=CL[t.client]||CL.custom;
      return`<div class="cal-dot ${done[t.id]?'done-dot':''}" style="background:${c.color};color:${c.dc}">${t.tipo}</div>`;
    }).join('');
    const more=dayTasks.length>3?`<div class="cal-more">+${dayTasks.length-3} mais</div>`:'';
    h+=`<div class="cal-day ${isToday?'today':''}" onclick="openDay('${dateStr}')">
      <div class="cal-day-num">${d}${dayTasks.length?` <span style="color:var(--done);font-size:9px">${doneCnt}/${dayTasks.length}</span>`:''}</div>
      <div class="cal-dots">${dots}${more}</div>
    </div>`;
  }
  grid.innerHTML=h;
}

// ── DAY MODAL ─────────────────────────────────────────────────────────────────
function openDay(dateStr){
  const tasks=filtered().filter(t=>t.date===dateStr);
  const{day,full}=fmt(dateStr);
  document.getElementById('dayModalTitle').textContent=`${day}, ${full}`;
  const cont=document.getElementById('dayModalTasks');
  if(!tasks.length){cont.innerHTML='<p class="empty" style="padding:20px 0">Nenhuma tarefa neste dia.</p>';
  }else{cont.innerHTML=tasks.map(t=>cardHTML(t)).join('');}
  document.getElementById('dayOverlay').classList.add('open');
}
document.getElementById('dayOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('dayOverlay'))document.getElementById('dayOverlay').classList.remove('open');});
document.getElementById('dayModalClose').addEventListener('click',()=>document.getElementById('dayOverlay').classList.remove('open'));

// ── REPORT RENDER ─────────────────────────────────────────────────────────────
function renderReport(){
  const el=document.getElementById('view-report');
  const tasks=all();
  const total=tasks.length;
  const comp=tasks.filter(t=>done[t.id]).length;
  const pct=total>0?Math.round(comp/total*100):0;

  if(comp===0){
    el.innerHTML=`<div class="report-header"><div class="report-title">Relatório — Maio 2026</div><div class="report-sub">Complete tarefas para ver seu relatório!</div></div><div class="report-empty">📋 Nenhuma tarefa concluída ainda.<br>Comece a marcar suas atividades!</div>`;
    return;
  }

  // By client
  const byClient={};
  Object.keys(CL).forEach(k=>{byClient[k]={total:0,done:0};});
  tasks.forEach(t=>{
    if(!byClient[t.client])byClient[t.client]={total:0,done:0};
    byClient[t.client].total++;
    if(done[t.id])byClient[t.client].done++;
  });

  // By tipo
  const byTipo={};
  tasks.filter(t=>done[t.id]).forEach(t=>{byTipo[t.tipo]=(byTipo[t.tipo]||0)+1;});
  const tipoIcons={'Carrossel':'🎠','Reels':'🎬','Stories':'📸','Post':'📝','Resposta Google':'⭐','Extra':'✨'};

  const clientRows=Object.entries(byClient)
    .filter(([,v])=>v.total>0)
    .sort((a,b)=>b[1].done-a[1].done)
    .map(([k,v])=>{
      const pct=v.total>0?Math.round(v.done/v.total*100):0;
      const c=CL[k]||CL.custom;
      return`<div class="report-client-row">
        <span class="badge ${c.cls}" style="min-width:100px;text-align:center">${c.name}</span>
        <div class="report-bar-wrap"><div class="report-bar" style="width:${pct}%;background:${c.dc}"></div></div>
        <span class="report-nums">${v.done}/${v.total}</span>
        <span class="report-pct">${pct}%</span>
      </div>`;
    }).join('');

  const tipoCards=Object.entries(byTipo).sort((a,b)=>b[1]-a[1]).map(([tipo,cnt])=>`
    <div class="report-tipo-card">
      <div class="report-tipo-icon">${tipoIcons[tipo]||'📌'}</div>
      <div class="report-tipo-info"><div class="report-tipo-name">${tipo}</div><div class="report-tipo-count">${cnt}</div></div>
    </div>`).join('');

  el.innerHTML=`
    <div class="report-header">
      <div class="report-title">Relatório — Maio 2026</div>
      <div class="report-sub">Resumo de todas as atividades realizadas</div>
    </div>
    <div class="report-summary">
      <div class="stat-card"><div class="stat-num">${comp}</div><div class="stat-label">Concluídas</div></div>
      <div class="stat-card"><div class="stat-num">${total-comp}</div><div class="stat-label">Pendentes</div></div>
      <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-label">Desempenho</div></div>
    </div>
    <div class="report-section">
      <div class="report-section-title">Por cliente</div>
      ${clientRows}
    </div>
    <div class="report-section">
      <div class="report-section-title">Por tipo de conteúdo</div>
      <div class="report-tipo-grid">${tipoCards}</div>
    </div>`;
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function updateProg(){
  const tasks=all();
  const comp=tasks.filter(t=>done[t.id]).length;
  const pct=tasks.length>0?Math.round(comp/tasks.length*100):0;
  document.getElementById('pb').style.width=pct+'%';
}

// ── TOGGLE / DELETE ───────────────────────────────────────────────────────────
function toggle(id){
  done[id]=!done[id];save();
  document.querySelectorAll(`[data-id="${id}"]`).forEach(card=>{
    card.classList.toggle('done',!!done[id]);
  });
  toast(done[id]?'✓ Concluída!':'Reaberta');
  updateProg();
  if(activeView==='report')renderReport();
}

function del(e,id){
  e.stopPropagation();
  custom=custom.filter(t=>t.id!==id);
  delete done[id];save();
  renderAll();toast('Removido');
}

// ── TABS ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    activeView=btn.dataset.view;
    document.getElementById('view-'+activeView).classList.add('active');
    // hide filters on report
    document.getElementById('filters').style.display=activeView==='report'?'none':'flex';
    renderView();
  });
});

function renderView(){
  if(activeView==='list')renderList();
  else if(activeView==='cal')renderCal();
  else renderReport();
}
function renderAll(){renderList();renderCal();renderReport();}

// ── FILTERS ───────────────────────────────────────────────────────────────────
document.getElementById('filters').addEventListener('click',e=>{
  if(!e.target.matches('.fbtn'))return;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  filter=e.target.dataset.f;
  renderView();
});

// ── ADD MODAL ─────────────────────────────────────────────────────────────────
const ov=document.getElementById('overlay');
document.getElementById('fab').addEventListener('click',()=>{
  document.getElementById('fDate').value='2026-05-05';
  document.getElementById('fTipo').value='';
  document.getElementById('fPrazo').value='';
  ov.classList.add('open');
});
document.getElementById('mcancel').addEventListener('click',()=>ov.classList.remove('open'));
ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');});
document.getElementById('msave').addEventListener('click',()=>{
  const date=document.getElementById('fDate').value;
  const client=document.getElementById('fClient').value;
  const tipo=document.getElementById('fTipo').value.trim();
  const prazo=document.getElementById('fPrazo').value.trim();
  if(!date||!tipo){toast('Preencha a data e a tarefa!');return;}
  custom.push({id:'c'+Date.now(),date,client,tipo,prazo,preset:false});
  save();ov.classList.remove('open');renderAll();toast('✓ Adicionado!');
});

// ── TOAST ─────────────────────────────────────────────────────────────────────
let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderAll();updateProg();
</script>
</body>
</html>
