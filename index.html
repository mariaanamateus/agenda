<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Social Media 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e8e4de;
    --text: #1a1815;
    --muted: #8a8279;
    --accent: #c9a96e;
    --accent-dark: #a0824e;
    --danger: #d64c4c;
    --radius: 12px;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--accent-dark); letter-spacing: 0.02em; }
  header h1 span { color: var(--muted); font-size: 0.9rem; font-family: 'DM Sans', sans-serif; font-weight: 300; display: block; }
  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* TABS */
  .tabs { display: flex; gap: 4px; background: var(--bg); border-bottom: 1px solid var(--border); padding: 0 28px; }
  .tab { padding: 12px 20px; border: none; background: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }
  .tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }

  /* BUTTONS */
  .btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent-dark); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-sm { padding: 5px 11px; font-size: 0.78rem; }

  /* VIEWS */
  .view { display: none; padding: 24px 28px; }
  .view.active { display: block; }

  /* LIST VIEW */
  .list-controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .search-box { flex: 1; min-width: 200px; padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; background: var(--surface); outline: none; }
  .search-box:focus { border-color: var(--accent); }
  select.filter-sel { padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; background: var(--surface); cursor: pointer; outline: none; color: var(--text); }

  .event-list { display: flex; flex-direction: column; gap: 8px; }
  .event-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: box-shadow 0.2s;
  }
  .event-card:hover { box-shadow: var(--shadow); }
  .event-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .event-info { flex: 1; }
  .event-client { font-weight: 600; font-size: 0.9rem; }
  .event-task { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .event-meta { display: flex; gap: 10px; font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .event-meta span { display: flex; align-items: center; gap: 4px; }
  .event-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* CALENDAR VIEW */
  .cal-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .cal-nav h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--accent-dark); flex: 1; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-day-header { text-align: center; font-size: 0.75rem; font-weight: 600; color: var(--muted); padding: 8px 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .cal-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 90px;
    padding: 6px;
    cursor: pointer;
    transition: box-shadow 0.2s;
  }
  .cal-cell:hover { box-shadow: var(--shadow); }
  .cal-cell.other-month { opacity: 0.4; }
  .cal-cell.today { border-color: var(--accent); }
  .cal-date { font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .cal-cell.today .cal-date { color: var(--accent-dark); }
  .cal-pill {
    font-size: 0.68rem;
    padding: 2px 6px;
    border-radius: 4px;
    color: white;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }
  .cal-more { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

  /* REPORT VIEW */
  .report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .report-card h3 { font-weight: 600; font-size: 0.95rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .report-dot { width: 10px; height: 10px; border-radius: 50%; }
  .report-row { display: flex; justify-content: space-between; font-size: 0.82rem; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .report-row:last-child { border-bottom: none; }
  .report-num { font-weight: 600; color: var(--accent-dark); }

  /* CLIENTS VIEW */
  .clients-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .client-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .client-card h3 { font-weight: 700; font-size: 1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .client-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .client-tag { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 0.75rem; margin: 2px; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; padding: 28px; width: 90%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 20px; color: var(--accent-dark); }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 6px; color: var(--muted); }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 0.875rem; background: var(--bg); outline: none; color: var(--text);
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* PAGINATION */
  .pagination { display: flex; gap: 6px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .page-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 0.82rem; transition: all 0.2s; }
  .page-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .page-btn:hover:not(.active) { border-color: var(--accent); }

  /* EMPTY */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .view { padding: 16px; }
    .tabs { padding: 0 16px; }
    .cal-grid { gap: 2px; }
    .cal-cell { min-height: 60px; }
  }
</style>
</head>
<body>

<header>
  <h1>Agenda Social<span>Maria Ana Mateus · Social Media</span></h1>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="openModal()">+ Novo</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('list')">📋 Lista</button>
  <button class="tab" onclick="switchTab('calendar')">🗓️ Calendário</button>
  <button class="tab" onclick="switchTab('report')">📊 Relatório</button>
  <button class="tab" onclick="switchTab('clients')">⚙️ Clientes</button>
</div>

<!-- LIST VIEW -->
<div class="view active" id="view-list">
  <div class="list-controls">
    <input class="search-box" type="text" placeholder="Buscar cliente ou tarefa..." id="search-input" oninput="renderList()">
    <select class="filter-sel" id="filter-client" onchange="renderList()">
      <option value="">Todos os clientes</option>
    </select>
    <select class="filter-sel" id="filter-task" onchange="renderList()">
      <option value="">Todos os tipos</option>
      <option value="Carrossel/Foto">Carrossel/Foto</option>
      <option value="Reel">Reel</option>
      <option value="Stories">Stories</option>
      <option value="Post">Post</option>
      <option value="Google">Avaliações Google</option>
    </select>
    <select class="filter-sel" id="filter-month" onchange="renderList()">
      <option value="">Todos os meses</option>
    </select>
  </div>
  <div class="event-list" id="event-list"></div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- CALENDAR VIEW -->
<div class="view" id="view-calendar">
  <div class="cal-nav">
    <button class="btn btn-ghost" onclick="prevMonth()">← Anterior</button>
    <h2 id="cal-title"></h2>
    <button class="btn btn-ghost" onclick="nextMonth()">Próximo →</button>
  </div>
  <div class="cal-grid" id="cal-grid">
    <div class="cal-day-header">Dom</div>
    <div class="cal-day-header">Seg</div>
    <div class="cal-day-header">Ter</div>
    <div class="cal-day-header">Qua</div>
    <div class="cal-day-header">Qui</div>
    <div class="cal-day-header">Sex</div>
    <div class="cal-day-header">Sáb</div>
  </div>
</div>

<!-- REPORT VIEW -->
<div class="view" id="view-report">
  <div class="report-grid" id="report-grid"></div>
</div>

<!-- CLIENTS VIEW -->
<div class="view" id="view-clients">
  <div class="clients-grid" id="clients-grid"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="modal-title">Novo Compromisso</h2>
    <div class="form-group">
      <label>Data</label>
      <input type="date" id="f-date">
    </div>
    <div class="form-group">
      <label>Horário</label>
      <input type="time" id="f-time">
    </div>
    <div class="form-group">
      <label>Cliente</label>
      <select id="f-client">
        <option value="Rei do Camarão">Rei do Camarão</option>
        <option value="Mediterra">Mediterra</option>
        <option value="Quiosque Girassol">Quiosque Girassol</option>
        <option value="Repool">Repool</option>
        <option value="Villa do Sol 1">Villa do Sol 1</option>
        <option value="Villa do Sol 2">Villa do Sol 2</option>
        <option value="UPH">UPH</option>
        <option value="UPG">UPG</option>
        <option value="ECO">ECO</option>
        <option value="Jundu Prumirim">Jundu Prumirim</option>
        <option value="Jundu Itagua">Jundu Itagua</option>
        <option value="Jundu Praia Grande">Jundu Praia Grande</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tarefa</label>
      <select id="f-task">
        <option>Carrossel/Foto</option>
        <option>Reel</option>
        <option>Post (Carrossel/Reel)</option>
        <option>Stories</option>
        <option>Stories (almoço)</option>
        <option>Responder Avaliações Google</option>
      </select>
    </div>
    <div class="form-group">
      <label>Observação (opcional)</label>
      <textarea id="f-obs" rows="2" style="resize:vertical"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEvent()">Salvar</button>
    </div>
  </div>
</div>

<!-- DAY MODAL -->
<div class="modal-overlay" id="day-modal" onclick="closeDayModal(event)">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:560px">
    <h2 id="day-modal-title"></h2>
    <div id="day-modal-list" style="max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
    <div class="modal-actions">
      <button class="btn btn-primary btn-sm" onclick="closeDayModal();openModal()">+ Adicionar</button>
      <button class="btn btn-ghost" onclick="closeDayModal()">Fechar</button>
    </div>
  </div>
</div>

// --- INIT ---
function init() {
  // Load from localStorage or use initial
  const stored = localStorage.getItem('agenda_events_v3');
  if (stored) {
    const parsed = JSON.parse(stored);
    events = parsed.events || [];
    nextId = parsed.nextId || 1;
  } else {
    events = INITIAL_EVENTS.map(e => ({ ...e }));
    nextId = Math.max(...events.map(e => e.id)) + 1;
    save();
  }
  populateFilters();
  renderList();
  renderReport();
  renderClients();
  renderCalendar();
}

function save() {
  localStorage.setItem('agenda_events_v3', JSON.stringify({ events, nextId }));
}

// --- FILTERS ---
function populateFilters() {
  const clients = [...new Set(events.map(e => e.client))].sort();
  const cs = document.getElementById('filter-client');
  cs.innerHTML = '<option value="">Todos os clientes</option>';
  clients.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; cs.appendChild(o); });

  const months = [...new Set(events.map(e => e.date.substring(0, 7)))].sort();
  const ms = document.getElementById('filter-month');
  ms.innerHTML = '<option value="">Todos os meses</option>';
  const mnames = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  months.forEach(m => {
    const [y, mo] = m.split('-');
    const o = document.createElement('option');
    o.value = m; o.textContent = mnames[parseInt(mo)-1] + '/' + y;
    ms.appendChild(o);
  });
}

function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const fc = document.getElementById('filter-client').value;
  const ft = document.getElementById('filter-task').value;
  const fm = document.getElementById('filter-month').value;
  return events.filter(e => {
    if (q && !e.client.toLowerCase().includes(q) && !e.task.toLowerCase().includes(q)) return false;
    if (fc && e.client !== fc) return false;
    if (ft && !e.task.includes(ft)) return false;
    if (fm && !e.date.startsWith(fm)) return false;
    return true;
  }).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
}

// --- LIST ---
function renderList() {
  const filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (currentPage > totalPages) currentPage = 1;
  const slice = filtered.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);

  const el = document.getElementById('event-list');
  if (slice.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>Nenhum evento encontrado</p></div>';
  } else {
    el.innerHTML = slice.map(e => {
      const cfg = CLIENT_CONFIG[e.client] || { color: '#999' };
      const dateStr = formatDateBR(e.date);
      return `<div class="event-card">
        <div class="event-dot" style="background:${cfg.color}"></div>
        <div class="event-info">
          <div class="event-client">${e.client}</div>
          <div class="event-task">${e.task}</div>
          <div class="event-meta">
            <span>📅 ${dateStr}</span>
            <span>🕐 ${e.time}</span>
            ${e.obs ? '<span>📝 '+e.obs+'</span>' : ''}
          </div>
        </div>
        <div class="event-actions">
          <button class="btn btn-ghost btn-sm" onclick="editEvent(${e.id})">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="deleteEvent(${e.id})">🗑️</button>
        </div>
      </div>`;
    }).join('');
  }

  // Pagination
  const pg = document.getElementById('pagination');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }
  let html = '';
  const range = 3;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - range && i <= currentPage + range)) {
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="gotoPage(${i})">${i}</button>`;
    } else if (i === currentPage - range - 1 || i === currentPage + range + 1) {
      html += '<span style="padding:4px">…</span>';
    }
  }
  pg.innerHTML = html;
}

function gotoPage(p) { currentPage = p; renderList(); window.scrollTo(0,0); }

// --- CALENDAR ---
function renderCalendar() {
  const mnames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('cal-title').textContent = mnames[calMonth] + ' ' + calYear;

  const grid = document.getElementById('cal-grid');
  // Remove cells (keep headers)
  while (grid.children.length > 7) grid.removeChild(grid.lastChild);

  const first = new Date(calYear, calMonth, 1);
  const last = new Date(calYear, calMonth+1, 0);
  const startDow = first.getDay(); // 0=Sun

  // Events for this month
  const monthStr = calYear + '-' + String(calMonth+1).padStart(2,'0');
  const monthEvents = {};
  events.forEach(e => {
    if (e.date.startsWith(monthStr)) {
      if (!monthEvents[e.date]) monthEvents[e.date] = [];
      monthEvents[e.date].push(e);
    }
  });

  const today = new Date().toISOString().split('T')[0];

  // Blank cells before
  for (let i = 0; i < startDow; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    grid.appendChild(cell);
  }

  for (let d = 1; d <= last.getDate(); d++) {
    const dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (dateStr === today ? ' today' : '');
    cell.onclick = () => showDayModal(dateStr);

    const dateEl = document.createElement('div');
    dateEl.className = 'cal-date';
    dateEl.textContent = d;
    cell.appendChild(dateEl);

    const dayEvs = (monthEvents[dateStr] || []).sort((a,b) => a.time.localeCompare(b.time));
    const show = dayEvs.slice(0, 3);
    show.forEach(e => {
      const cfg = CLIENT_CONFIG[e.client] || { color: '#999' };
      const pill = document.createElement('span');
      pill.className = 'cal-pill';
      pill.style.background = cfg.color;
      pill.title = e.client + ' · ' + e.task + ' · ' + e.time;
      pill.textContent = e.client.split(' ')[0] + ' ' + e.time;
      cell.appendChild(pill);
    });
    if (dayEvs.length > 3) {
      const more = document.createElement('div');
      more.className = 'cal-more';
      more.textContent = '+' + (dayEvs.length - 3) + ' mais';
      cell.appendChild(more);
    }
    grid.appendChild(cell);
  }

  // Fill trailing
  const totalCells = startDow + last.getDate();
  const trailing = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 0; i < trailing; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    grid.appendChild(cell);
  }
}

function prevMonth() {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}
function nextMonth() {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

// --- DAY MODAL ---
function showDayModal(dateStr) {
  const dayEvs = events.filter(e => e.date === dateStr).sort((a,b) => a.time.localeCompare(b.time));
  document.getElementById('day-modal-title').textContent = '📅 ' + formatDateBR(dateStr);
  const list = document.getElementById('day-modal-list');
  if (dayEvs.length === 0) {
    list.innerHTML = '<p style="color:var(--muted);font-size:0.875rem">Nenhum evento neste dia.</p>';
  } else {
    list.innerHTML = dayEvs.map(e => {
      const cfg = CLIENT_CONFIG[e.client] || { color: '#999' };
      return `<div class="event-card" style="padding:10px 14px">
        <div class="event-dot" style="background:${cfg.color}"></div>
        <div class="event-info">
          <div class="event-client" style="font-size:0.85rem">${e.client}</div>
          <div class="event-task">${e.task}</div>
          <div class="event-meta"><span>🕐 ${e.time}</span>${e.obs?'<span>📝 '+e.obs+'</span>':''}</div>
        </div>
        <div class="event-actions">
          <button class="btn btn-ghost btn-sm" onclick="closeDayModal();editEvent(${e.id})">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="deleteFromDay(${e.id},'${dateStr}')">🗑️</button>
        </div>
      </div>`;
    }).join('');
  }
  // Pre-fill date for new event
  document.getElementById('f-date').value = dateStr;
  document.getElementById('day-modal').classList.add('open');
}

function deleteFromDay(id, dateStr) {
  events = events.filter(e => e.id !== id);
  save();
  showDayModal(dateStr);
  renderCalendar();
  renderList();
  renderReport();
}

function closeDayModal(e) {
  if (e && e.target !== document.getElementById('day-modal')) return;
  document.getElementById('day-modal').classList.remove('open');
}

// --- REPORT ---
function renderReport() {
  const grid = document.getElementById('report-grid');
  const clients = [...new Set(events.map(e => e.client))].sort();
  grid.innerHTML = clients.map(c => {
    const cfg = CLIENT_CONFIG[c] || { color: '#999' };
    const ces = events.filter(e => e.client === c);
    const types = {};
    ces.forEach(e => { const t = e.task.split(' ')[0]; types[t] = (types[t]||0)+1; });
    const rows = Object.entries(types).map(([t,n]) =>
      `<div class="report-row"><span>${t}</span><span class="report-num">${n}</span></div>`
    ).join('');
    return `<div class="report-card">
      <h3><span class="report-dot" style="background:${cfg.color}"></span>${c}</h3>
      ${rows}
      <div class="report-row" style="font-weight:600"><span>Total</span><span class="report-num">${ces.length}</span></div>
    </div>`;
  }).join('');
}

// --- CLIENTS ---
function renderClients() {
  const grid = document.getElementById('clients-grid');
  grid.innerHTML = Object.entries(CLIENT_CONFIG).map(([name, cfg]) => {
    const tags = cfg.desc.split(' · ').map(t => `<span class="client-tag">${t}</span>`).join('');
    return `<div class="client-card">
      <h3><span class="report-dot" style="background:${cfg.color}"></span>${name}</h3>
      <div class="client-desc">${tags}</div>
    </div>`;
  }).join('');
}

// --- MODAL ---
function openModal(prefillDate) {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Novo Compromisso';
  document.getElementById('f-date').value = prefillDate || new Date().toISOString().split('T')[0];
  document.getElementById('f-time').value = '09:00';
  document.getElementById('f-client').value = 'Rei do Camarão';
  document.getElementById('f-task').value = 'Carrossel/Foto';
  document.getElementById('f-obs').value = '';
  document.getElementById('modal').classList.add('open');
}

function editEvent(id) {
  const e = events.find(ev => ev.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Editar Compromisso';
  document.getElementById('f-date').value = e.date;
  document.getElementById('f-time').value = e.time;
  document.getElementById('f-client').value = e.client;
  document.getElementById('f-task').value = e.task;
  document.getElementById('f-obs').value = e.obs || '';
  document.getElementById('modal').classList.add('open');
}

function saveEvent() {
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const client = document.getElementById('f-client').value;
  const task = document.getElementById('f-task').value;
  const obs = document.getElementById('f-obs').value;
  if (!date || !client || !task) { alert('Preencha todos os campos obrigatórios.'); return; }

  const cfg = CLIENT_CONFIG[client] || { color: '#999' };
  if (editingId) {
    const idx = events.findIndex(e => e.id === editingId);
    if (idx >= 0) events[idx] = { ...events[idx], date, time, client, task, obs, color: cfg.color };
  } else {
    events.push({ id: nextId++, date, time, client, task, obs, color: cfg.color });
  }
  save();
  closeModal();
  populateFilters();
  renderList();
  renderCalendar();
  renderReport();
}

function deleteEvent(id) {
  if (!confirm('Excluir este evento?')) return;
  events = events.filter(e => e.id !== id);
  save();
  populateFilters();
  renderList();
  renderCalendar();
  renderReport();
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('open');
}

// --- TABS ---
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const tabs = ['list','calendar','report','clients'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  if (tab === 'calendar') renderCalendar();
}

// --- UTILS ---
function formatDateBR(str) {
  const [y,m,d] = str.split('-');
  const mnames = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return d + ' ' + mnames[parseInt(m)-1] + ' ' + y;
}

init();
</script>
</body>
</html>
