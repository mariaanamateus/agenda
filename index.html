<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Social Media 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fdf9f6;--surface:#fffcfa;--border:#ece6de;--text:#2a2118;--muted:#a09488;
  --pink:#f7d4d4;--pink-d:#c47070;--lilac:#ddd0ef;--lilac-d:#8a67b0;
  --yellow:#f5e9c0;--yellow-d:#c4a030;--green:#cce8cc;--green-d:#4e9a55;
  --blue:#ccdff0;--blue-d:#4478b0;--peach:#f5dac8;--peach-d:#c47840;
  --rose:#f0d0e0;--rose-d:#b05080;--mint:#c8f0e8;--mint-d:#2a9a78;
  --done:#4e9a55;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* NAV */
.nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.nav-top{max-width:980px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.nav-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;padding:14px 0;white-space:nowrap;}
.nav-title em{font-style:italic;color:var(--muted);font-weight:400;}
.tabs{display:flex;}
.tab{background:none;border:none;padding:14px 14px;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab.active{color:var(--text);border-bottom-color:var(--text);}

/* MONTH NAV */
.month-nav{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.month-btn{border:1.5px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:11px;font-family:'Jost',sans-serif;font-weight:500;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;}
.month-btn.active{background:var(--text);color:#fff;border-color:var(--text);}

/* PROGRESS */
.prog-wrap{background:var(--border);height:3px;}
.prog-bar{height:100%;background:linear-gradient(90deg,#a8d5a2,#7ab5d4);transition:width .6s;}

/* FILTERS */
.filters{max-width:980px;margin:12px auto 0;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap;}
.fbtn{border:1.5px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:11px;font-family:'Jost',sans-serif;font-weight:500;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;}
.fbtn.active,.fbtn:hover{background:var(--text);color:#fff;border-color:var(--text);}

/* VIEWS */
.view{display:none;max-width:980px;margin:0 auto;padding:16px 16px 100px;}
.view.active{display:block;}

/* LIST */
.wgroup{margin-bottom:28px;}
.wlabel{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.dgroup{margin-bottom:14px;}
.dheader{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.dname{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;min-width:28px;}
.ddate{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;}
.dline{flex:1;height:1px;background:var(--border);}
.tasks{display:flex;flex-direction:column;gap:5px;}

.card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:11px;padding:9px 12px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc,var(--border));}
.card:hover{border-color:#ccc;transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.05);}
.card.done{opacity:.45;}
.card.done .ctitle{text-decoration:line-through;color:var(--muted);}
.card.done::before{background:var(--done)!important;}
.cw{flex-shrink:0;width:19px;height:19px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .2s;}
.card.done .cw{background:var(--done);border-color:var(--done);}
.ci{opacity:0;color:#fff;font-size:10px;}
.card.done .ci{opacity:1;}
.cc{flex:1;min-width:0;}
.ctitle{font-size:12px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmeta{display:flex;gap:4px;flex-wrap:wrap;}
.tag{font-size:9px;font-weight:500;padding:1px 6px;border-radius:99px;white-space:nowrap;}
.tt{background:var(--peach);color:var(--peach-d);}
.tp{background:var(--yellow);color:var(--yellow-d);}
.tx{background:var(--blue);color:var(--blue-d);}
.badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
.delbtn{flex-shrink:0;background:none;border:none;color:var(--border);font-size:15px;cursor:pointer;padding:0 3px;line-height:1;transition:color .2s;display:none;}
.card:hover .delbtn{display:block;}
.delbtn:hover{color:var(--pink-d);}

/* CLIENT COLORS */
.c-rei{background:var(--pink);color:var(--pink-d);}
.c-med{background:var(--lilac);color:var(--lilac-d);}
.c-qui{background:var(--yellow);color:var(--yellow-d);}
.c-rep{background:var(--peach);color:var(--peach-d);}
.c-vs1{background:var(--green);color:var(--green-d);}
.c-vs2{background:var(--blue);color:var(--blue-d);}
.c-uph{background:var(--pink);color:var(--pink-d);}
.c-upg{background:var(--lilac);color:var(--lilac-d);}
.c-eco{background:var(--green);color:var(--green-d);}
.c-jun{background:var(--yellow);color:var(--yellow-d);}
.c-custom{background:var(--blue);color:var(--blue-d);}
.card[data-c="rei"]{--cc:var(--pink-d);}
.card[data-c="med"]{--cc:var(--lilac-d);}
.card[data-c="qui"]{--cc:var(--yellow-d);}
.card[data-c="rep"]{--cc:var(--peach-d);}
.card[data-c="vs1"]{--cc:var(--green-d);}
.card[data-c="vs2"]{--cc:var(--blue-d);}
.card[data-c="uph"]{--cc:var(--pink-d);}
.card[data-c="upg"]{--cc:var(--lilac-d);}
.card[data-c="eco"]{--cc:var(--green-d);}
.card[data-c="jun"]{--cc:var(--yellow-d);}
.card[data-c="custom"]{--cc:var(--blue-d);}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{font-size:9px;font-weight:600;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:5px 0;}
.cal-day{min-height:72px;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;padding:5px;cursor:pointer;transition:all .2s;}
.cal-day:hover{border-color:#bbb;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-day.today{border-color:var(--text);border-width:2px;}
.cal-day-num{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:2px;}
.cal-day.today .cal-day-num{color:var(--text);}
.cal-dots{display:flex;flex-direction:column;gap:2px;}
.cal-dot{font-size:8px;padding:1px 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.cal-dot.done-dot{opacity:.35;text-decoration:line-through;}
.cal-more{font-size:8px;color:var(--muted);margin-top:1px;}

/* DAY MODAL */
.day-overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(42,33,24,.35);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center;}
.day-overlay.open{display:flex;}
.day-modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:75vh;overflow-y:auto;padding:22px 18px 40px;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.day-modal-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.day-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;}

/* REPORT */
.report-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;margin-bottom:4px;}
.report-sub{font-size:12px;color:var(--muted);margin-bottom:22px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
.stat{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
.stat-n{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1;}
.stat-l{font-size:10px;color:var(--muted);margin-top:3px;font-weight:500;}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.sec{margin-bottom:20px;}
.rrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.rrow:last-child{border:none;}
.rbar-w{flex:2;background:var(--border);border-radius:99px;height:5px;overflow:hidden;}
.rbar{height:100%;border-radius:99px;background:var(--green-d);transition:width .8s;}
.rnums{font-size:11px;color:var(--muted);min-width:55px;text-align:right;}
.rpct{font-size:11px;font-weight:600;min-width:32px;text-align:right;}
.tipo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.tipo-card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;}
.tipo-icon{font-size:16px;}
.tipo-n{font-size:10px;font-weight:500;}
.tipo-cnt{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;}
.report-empty{text-align:center;color:var(--muted);font-size:13px;padding:36px 0;font-style:italic;}

/* CLIENT MANAGER */
.client-manager{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
.client-manager-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;margin-bottom:12px;}
.client-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.client-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border-radius:8px;}
.client-item-name{flex:1;font-size:12px;font-weight:500;}
.client-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px;}
.client-del:hover{color:var(--pink-d);}
.add-client-row{display:flex;gap:6px;}
.add-client-input{flex:1;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;font-size:12px;background:var(--bg);color:var(--text);outline:none;}
.add-client-input:focus{border-color:#aaa;}
.add-client-btn{padding:7px 14px;border-radius:8px;border:none;background:var(--text);color:#fff;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;cursor:pointer;}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;z-index:200;width:50px;height:50px;border-radius:50%;background:var(--text);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.fab:hover{transform:scale(1.08);}

/* ADD MODAL */
.overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(42,33,24,.38);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:18px;padding:24px 20px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal h2{font-family:'Cormorant Garamond',serif;font-size:19px;margin-bottom:16px;}
.fg{margin-bottom:11px;}
.fg label{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px;}
.fg input,.fg select{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s;}
.fg input:focus,.fg select:focus{border-color:#aaa;}
.mactions{display:flex;gap:7px;margin-top:16px;}
.bcancel{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:transparent;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;color:var(--muted);}
.bsave{flex:2;padding:9px;border-radius:8px;border:none;background:var(--text);color:#fff;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;cursor:pointer;}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:#fff;padding:7px 15px;border-radius:99px;font-size:12px;font-weight:500;z-index:999;transition:transform .3s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;font-style:italic;}

@media(max-width:600px){
  .nav-title{font-size:15px;}
  .tab{padding:11px 9px;font-size:11px;}
  .view{padding:12px 12px 90px;}
  .filters,.month-nav{padding:0 12px;}
  .stats{grid-template-columns:repeat(3,1fr);}
  .cal-day{min-height:55px;padding:3px;}
  .cal-dot{font-size:7px;}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-top">
    <div class="nav-title">Agenda <em>Social</em></div>
    <div class="tabs">
      <button class="tab active" data-view="list">📋 Lista</button>
      <button class="tab" data-view="cal">🗓️ Calendário</button>
      <button class="tab" data-view="report">📊 Relatório</button>
      <button class="tab" data-view="settings">⚙️ Clientes</button>
    </div>
  </div>
  <div class="month-nav" id="monthNav"></div>
</div>
<div class="prog-wrap"><div class="prog-bar" id="pb" style="width:0%"></div></div>

<div class="filters" id="filters"></div>

<div class="view active" id="view-list"></div>
<div class="view" id="view-cal"></div>
<div class="view" id="view-report"></div>
<div class="view" id="view-settings"></div>

<!-- DAY MODAL -->
<div class="day-overlay" id="dayOverlay">
  <div class="day-modal">
    <div class="day-modal-title">
      <span id="dayTitle"></span>
      <button class="day-close" id="dayClose">×</button>
    </div>
    <div id="dayTasks"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Novo compromisso</h2>
    <div class="fg"><label>Data</label><input type="date" id="fDate"></div>
    <div class="fg"><label>Cliente</label><select id="fClient"></select></div>
    <div class="fg"><label>Tarefa</label><input type="text" id="fTipo" placeholder="Ex: Reunião, Carrossel..."></div>
    <div class="fg"><label>Observação (opcional)</label><input type="text" id="fPrazo" placeholder="Ex: Até 19h"></div>
    <div class="mactions">
      <button class="bcancel" id="mcancel">Cancelar</button>
      <button class="bsave" id="msave">Salvar</button>
    </div>
  </div>
</div>

<button class="fab" id="fab">+</button>
<div class="toast" id="toast"></div>

<script>
// ── MONTHS ────────────────────────────────────────────────────────────────────
const MONTHS_LIST = [
  {y:2026,m:4,label:'Maio 2026'},
  {y:2026,m:5,label:'Junho 2026'},
  {y:2026,m:6,label:'Julho 2026'},
  {y:2026,m:7,label:'Agosto 2026'},
  {y:2026,m:8,label:'Setembro 2026'},
  {y:2026,m:9,label:'Outubro 2026'},
  {y:2026,m:10,label:'Novembro 2026'},
  {y:2026,m:11,label:'Dezembro 2026'},
  {y:2027,m:0,label:'Janeiro 2027'},
];
const DAYS_PT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// ── STORAGE KEYS ──────────────────────────────────────────────────────────────
const SK_DONE    = 'ag2_done';
const SK_CUSTOM  = 'ag2_custom';
const SK_CLIENTS = 'ag2_clients';

// ── DEFAULT CLIENTS ───────────────────────────────────────────────────────────
const DEFAULT_CLIENTS = [
  {id:'rei',name:'Rei do Camarão',color:'#f7d4d4',dc:'#c47070',cls:'c-rei'},
  {id:'med',name:'Mediterra',color:'#ddd0ef',dc:'#8a67b0',cls:'c-med'},
  {id:'qui',name:'Quiosque Girassol',color:'#f5e9c0',dc:'#c4a030',cls:'c-qui'},
  {id:'rep',name:'Repool',color:'#f5dac8',dc:'#c47840',cls:'c-rep'},
  {id:'vs1',name:'Villa do Sol I',color:'#cce8cc',dc:'#4e9a55',cls:'c-vs1'},
  {id:'vs2',name:'Villa do Sol II',color:'#ccdff0',dc:'#4478b0',cls:'c-vs2'},
  {id:'uph',name:'UPH',color:'#f7d4d4',dc:'#c47070',cls:'c-uph'},
  {id:'upg',name:'UPG',color:'#ddd0ef',dc:'#8a67b0',cls:'c-upg'},
  {id:'eco',name:'ECO',color:'#cce8cc',dc:'#4e9a55',cls:'c-eco'},
  {id:'jun',name:'Jundus',color:'#f5e9c0',dc:'#c4a030',cls:'c-jun'},
];

const CUSTOM_COLORS = [
  {color:'#f0d0e0',dc:'#b05080'},{color:'#c8f0e8',dc:'#2a9a78'},
  {color:'#d0e8f8',dc:'#3070a0'},{color:'#f0e8c8',dc:'#907030'},
  {color:'#e8d0f8',dc:'#7040a0'},{color:'#d8f0d0',dc:'#408040'},
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let done    = JSON.parse(localStorage.getItem(SK_DONE)   || '{}');
let custom  = JSON.parse(localStorage.getItem(SK_CUSTOM) || '[]');
let clients = JSON.parse(localStorage.getItem(SK_CLIENTS)|| 'null') || DEFAULT_CLIENTS;

let activeView  = 'list';
let activeMonth = 0; // index into MONTHS_LIST
let filter      = 'all';

function save() {
  localStorage.setItem(SK_DONE,   JSON.stringify(done));
  localStorage.setItem(SK_CUSTOM, JSON.stringify(custom));
  localStorage.setItem(SK_CLIENTS,JSON.stringify(clients));
}

function clientById(id) {
  return clients.find(c=>c.id===id) || {name:'Extra',color:'#ccdff0',dc:'#4478b0',cls:'c-custom',id:'custom'};
}

// ── TASK GENERATION ───────────────────────────────────────────────────────────
let _pid = 0;
function pid(){ return 'p'+(_pid++); }

function daysInMonth(year, month) {
  return new Date(year, month+1, 0).getDate();
}

function getWeekdays(year, month) {
  // Mon-Fri
  const days = [];
  const total = daysInMonth(year, month);
  for(let d=1; d<=total; d++) {
    const dow = new Date(year, month, d).getDay();
    if(dow >= 1 && dow <= 5) days.push(d);
  }
  return days;
}

function getEveryOtherWeekday(year, month, startOffset=0) {
  const wd = getWeekdays(year, month);
  return wd.filter((_,i) => (i+startOffset) % 2 === 0);
}

function ds(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

function twoPerWeek(year, month) {
  // Pick Tue and Thu of each week, or first available
  const total = daysInMonth(year, month);
  const tues=[], thus=[];
  for(let d=1; d<=total; d++){
    const dow = new Date(year,month,d).getDay();
    if(dow===2) tues.push(d);
    if(dow===4) thus.push(d);
  }
  return {tues, thus};
}

function twoPerWeekAlt(year, month) {
  const total = daysInMonth(year, month);
  const wed=[], fri=[];
  for(let d=1; d<=total; d++){
    const dow = new Date(year,month,d).getDay();
    if(dow===3) wed.push(d);
    if(dow===5) fri.push(d);
  }
  return {wed, fri};
}

function vsWeeks(year, month) {
  // 2 posts per week: first and third week (approx day 1-7, 15-21)
  const total = daysInMonth(year, month);
  const wed=[];
  for(let d=1; d<=total; d++){
    const dow = new Date(year,month,d).getDay();
    if(dow===3) wed.push(d);
  }
  return wed.slice(0,2);
}

function generatePreset(year, month) {
  const tasks = [];
  function t(d, client, tipo, prazo='') {
    tasks.push({id:pid(), date:ds(year,month,d), client, tipo, prazo, preset:true});
  }

  const wd = getWeekdays(year, month);
  const {tues, thus} = twoPerWeek(year, month);
  const {wed, fri} = twoPerWeekAlt(year, month);

  // REI DO CAMARÃO — Carrossel Ter, Reels Qui, Stories todo dia + Google Seg-Sex
  tues.forEach(d => t(d,'rei','Carrossel','Até 19h'));
  thus.forEach(d => t(d,'rei','Reels','Até 19h'));
  wd.forEach(d => t(d,'rei','Stories','Hr. almoço'));
  wd.forEach(d => t(d,'rei','Resposta Google',''));

  // MEDITERRA — igual Rei
  tues.forEach(d => t(d,'med','Carrossel','Até 19h'));
  thus.forEach(d => t(d,'med','Reels','Até 19h'));
  wd.forEach(d => t(d,'med','Stories','Hr. almoço'));

  // QUIOSQUE GIRASSOL — Carrossel Qua, Reels Sex + Stories
  wed.forEach(d => t(d,'qui','Carrossel','Até 19h'));
  fri.forEach(d => t(d,'qui','Reels','Até 19h'));
  wd.forEach(d => t(d,'qui','Stories','Hr. almoço'));

  // REPOOL — 2x/sem + 2 Stories/dia
  tues.slice(0,2).forEach(d => t(d,'rep','Carrossel',''));
  thus.slice(0,2).forEach(d => t(d,'rep','Reels',''));
  wd.forEach(d => { t(d,'rep','Stories',''); t(d,'rep','Stories',''); });

  // VILLA DO SOL I — 1 Post + 2 Stories, 2x/sem
  vsWeeks(year,month).forEach(d => t(d,'vs1','Post',''));
  wed.slice(0,4).forEach(d => { t(d,'vs1','Stories',''); t(d,'vs1','Stories',''); });

  // VILLA DO SOL II — 1 Post + 2 Stories, 2x/sem
  thus.slice(0,2).forEach(d => t(d,'vs2','Post',''));
  thus.slice(0,4).forEach(d => { t(d,'vs2','Stories',''); t(d,'vs2','Stories',''); });

  // UPH — Post dia sim/dia não + 2 Stories todo dia
  getEveryOtherWeekday(year,month,0).forEach(d => t(d,'uph','Post',''));
  wd.forEach(d => { t(d,'uph','Stories',''); t(d,'uph','Stories',''); });

  // UPG — Post dia sim/dia não (offset) + 2 Stories todo dia
  getEveryOtherWeekday(year,month,1).forEach(d => t(d,'upg','Post',''));
  wd.forEach(d => { t(d,'upg','Stories',''); t(d,'upg','Stories',''); });

  // ECO — Post dia sim/dia não + 2 Stories todo dia
  getEveryOtherWeekday(year,month,0).forEach(d => t(d,'eco','Post',''));
  wd.forEach(d => { t(d,'eco','Stories',''); t(d,'eco','Stories',''); });

  // JUNDUS — Resposta Google Seg-Sex
  wd.forEach(d => t(d,'jun','Resposta Google',''));

  return tasks;
}

// ── PRESET CACHE ──────────────────────────────────────────────────────────────
const PRESET_CACHE = {};
function getPreset(mi) {
  if(!PRESET_CACHE[mi]) {
    const {y,m} = MONTHS_LIST[mi];
    PRESET_CACHE[mi] = generatePreset(y, m);
  }
  return PRESET_CACHE[mi];
}

function allTasks(mi) {
  return [...getPreset(mi), ...custom.filter(t => {
    const {y,m} = MONTHS_LIST[mi];
    const td = new Date(t.date+'T12:00:00');
    return td.getFullYear()===y && td.getMonth()===m;
  })];
}

function filteredTasks(mi) {
  const all = allTasks(mi);
  return filter==='all' ? all : all.filter(t=>t.client===filter);
}

// ── CARD HTML ─────────────────────────────────────────────────────────────────
function cardHTML(t) {
  const dn = !!done[t.id];
  const c = clientById(t.client);
  const isCust = !t.preset;
  return `<div class="card ${dn?'done':''}" data-c="${t.client}" data-id="${t.id}" onclick="toggle('${t.id}')">
    <div class="cw"><span class="ci">✓</span></div>
    <div class="cc">
      <div class="ctitle">${t.tipo}${t.prazo?' · '+t.prazo:''}</div>
      <div class="cmeta">
        <span class="tag tt">${t.tipo}</span>
        ${t.prazo?`<span class="tag tp">⏰ ${t.prazo}</span>`:''}
        ${isCust?`<span class="tag tx">➕ extra</span>`:''}
      </div>
    </div>
    <span class="badge" style="background:${c.color};color:${c.dc}">${c.name}</span>
    ${isCust?`<button class="delbtn" onclick="delTask(event,'${t.id}')">×</button>`:''}
  </div>`;
}

// ── LIST RENDER ───────────────────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('view-list');
  const tasks = filteredTasks(activeMonth);
  if(!tasks.length){ el.innerHTML='<p class="empty">Nenhuma tarefa encontrada.</p>'; return; }

  const byDay = {};
  tasks.forEach(t => {
    if(!byDay[t.date]) byDay[t.date]=[];
    byDay[t.date].push(t);
  });

  const {y,m} = MONTHS_LIST[activeMonth];
  const weeks = {};
  Object.keys(byDay).sort().forEach(date => {
    const d = new Date(date+'T12:00:00');
    const weekNum = Math.ceil(d.getDate()/7);
    const wk = `Semana ${weekNum} — ${MONTHS_PT[m]} ${y}`;
    if(!weeks[wk]) weeks[wk]={};
    weeks[wk][date] = byDay[date];
  });

  let h='';
  for(const [wk,days] of Object.entries(weeks)){
    h+=`<div class="wgroup"><div class="wlabel">${wk}</div>`;
    for(const date of Object.keys(days).sort()){
      const dt=new Date(date+'T12:00:00');
      const dayName=DAYS_PT[dt.getDay()];
      const dayFull=`${dt.getDate()} de ${MONTHS_PT[dt.getMonth()]}`;
      h+=`<div class="dgroup"><div class="dheader"><span class="dname">${dayName}</span><span class="ddate">${dayFull}</span><div class="dline"></div></div><div class="tasks">`;
      days[date].forEach(t=>{ h+=cardHTML(t); });
      h+=`</div></div>`;
    }
    h+=`</div>`;
  }
  el.innerHTML = h;
  updateProg();
}

// ── CALENDAR RENDER ───────────────────────────────────────────────────────────
function renderCal() {
  const el = document.getElementById('view-cal');
  const {y,m,label} = MONTHS_LIST[activeMonth];
  const tasks = filteredTasks(activeMonth);
  const total = daysInMonth(y,m);
  const firstDow = new Date(y,m,1).getDay();
  const today = new Date();

  let h = `<div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:14px">${label}</div>`;
  h += `<div class="cal-grid">`;
  h += DAYS_PT.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) h+=`<div class="cal-day empty"></div>`;

  for(let d=1;d<=total;d++){
    const dateStr=ds(y,m,d);
    const dayTasks=tasks.filter(t=>t.date===dateStr);
    const isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    const doneCnt=dayTasks.filter(t=>done[t.id]).length;
    const dots=dayTasks.slice(0,3).map(t=>{
      const c=clientById(t.client);
      return`<div class="cal-dot ${done[t.id]?'done-dot':''}" style="background:${c.color};color:${c.dc}">${t.tipo}</div>`;
    }).join('');
    const more=dayTasks.length>3?`<div class="cal-more">+${dayTasks.length-3}</div>`:'';
    h+=`<div class="cal-day ${isToday?'today':''}" onclick="openDay('${dateStr}')">
      <div class="cal-day-num">${d}${dayTasks.length?` <span style="color:var(--done);font-size:8px">${doneCnt}/${dayTasks.length}</span>`:''}</div>
      <div class="cal-dots">${dots}${more}</div>
    </div>`;
  }
  h+=`</div>`;
  el.innerHTML=h;
}

// ── DAY MODAL ─────────────────────────────────────────────────────────────────
function openDay(dateStr){
  const tasks = filteredTasks(activeMonth).filter(t=>t.date===dateStr);
  const dt=new Date(dateStr+'T12:00:00');
  document.getElementById('dayTitle').textContent=`${DAYS_PT[dt.getDay()]}, ${dt.getDate()} de ${MONTHS_PT[dt.getMonth()]}`;
  document.getElementById('dayTasks').innerHTML = tasks.length
    ? `<div class="tasks">${tasks.map(t=>cardHTML(t)).join('')}</div>`
    : '<p class="empty" style="padding:16px 0">Nenhuma tarefa neste dia.</p>';
  document.getElementById('dayOverlay').classList.add('open');
}
document.getElementById('dayOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('dayOverlay'))document.getElementById('dayOverlay').classList.remove('open');});
document.getElementById('dayClose').addEventListener('click',()=>document.getElementById('dayOverlay').classList.remove('open'));

// ── REPORT RENDER ─────────────────────────────────────────────────────────────
function renderReport() {
  const el = document.getElementById('view-report');
  const {label} = MONTHS_LIST[activeMonth];
  const tasks = allTasks(activeMonth);
  const total = tasks.length;
  const comp = tasks.filter(t=>done[t.id]).length;
  const pct = total>0?Math.round(comp/total*100):0;

  if(comp===0){
    el.innerHTML=`<div class="report-title">Relatório — ${label}</div><div class="report-sub">Complete tarefas para ver o relatório!</div><div class="report-empty">📋 Nenhuma tarefa concluída ainda.</div>`;
    return;
  }

  const byClient={};
  clients.forEach(c=>{ byClient[c.id]={total:0,done:0,c}; });
  tasks.forEach(t=>{
    if(!byClient[t.client]) byClient[t.client]={total:0,done:0,c:clientById(t.client)};
    byClient[t.client].total++;
    if(done[t.id]) byClient[t.client].done++;
  });

  const byTipo={};
  tasks.filter(t=>done[t.id]).forEach(t=>{ byTipo[t.tipo]=(byTipo[t.tipo]||0)+1; });
  const icons={'Carrossel':'🎠','Reels':'🎬','Stories':'📸','Post':'📝','Resposta Google':'⭐'};

  const cRows = Object.values(byClient).filter(v=>v.total>0)
    .sort((a,b)=>b.done-a.done)
    .map(v=>{
      const p=v.total>0?Math.round(v.done/v.total*100):0;
      return`<div class="rrow">
        <span class="badge" style="background:${v.c.color};color:${v.c.dc};min-width:90px;text-align:center">${v.c.name}</span>
        <div class="rbar-w"><div class="rbar" style="width:${p}%;background:${v.c.dc}"></div></div>
        <span class="rnums">${v.done}/${v.total}</span>
        <span class="rpct">${p}%</span>
      </div>`;
    }).join('');

  const tCards = Object.entries(byTipo).sort((a,b)=>b[1]-a[1]).map(([tipo,cnt])=>`
    <div class="tipo-card">
      <div class="tipo-icon">${icons[tipo]||'📌'}</div>
      <div><div class="tipo-n">${tipo}</div><div class="tipo-cnt">${cnt}</div></div>
    </div>`).join('');

  el.innerHTML=`
    <div class="report-title">Relatório — ${label}</div>
    <div class="report-sub">Resumo de atividades realizadas</div>
    <div class="stats">
      <div class="stat"><div class="stat-n">${comp}</div><div class="stat-l">Concluídas</div></div>
      <div class="stat"><div class="stat-n">${total-comp}</div><div class="stat-l">Pendentes</div></div>
      <div class="stat"><div class="stat-n">${pct}%</div><div class="stat-l">Desempenho</div></div>
    </div>
    <div class="sec"><div class="sec-title">Por cliente</div>${cRows}</div>
    <div class="sec"><div class="sec-title">Por tipo de conteúdo</div><div class="tipo-grid">${tCards}</div></div>`;
}

// ── SETTINGS RENDER ───────────────────────────────────────────────────────────
function renderSettings() {
  const el = document.getElementById('view-settings');
  const items = clients.map(c=>`
    <div class="client-item">
      <span class="badge" style="background:${c.color};color:${c.dc}">${c.name}</span>
      <span class="client-item-name">${c.name}</span>
      ${DEFAULT_CLIENTS.find(d=>d.id===c.id)?'':`<button class="client-del" onclick="delClient('${c.id}')">×</button>`}
    </div>`).join('');

  el.innerHTML=`
    <div class="client-manager">
      <div class="client-manager-title">Gerenciar Clientes</div>
      <div class="client-list">${items}</div>
      <div class="add-client-row">
        <input class="add-client-input" id="newClientName" placeholder="Nome do novo cliente...">
        <button class="add-client-btn" onclick="addClient()">+ Adicionar</button>
      </div>
    </div>
    <p style="font-size:11px;color:var(--muted);text-align:center">Os clientes adicionados aqui ficam disponíveis para usar em novos compromissos em qualquer mês.</p>`;
}

function addClient() {
  const name = document.getElementById('newClientName').value.trim();
  if(!name){ toast('Digite o nome do cliente!'); return; }
  if(clients.find(c=>c.name.toLowerCase()===name.toLowerCase())){ toast('Cliente já existe!'); return; }
  const colorSet = CUSTOM_COLORS[clients.length % CUSTOM_COLORS.length];
  const id = 'cli_' + Date.now();
  clients.push({id, name, color:colorSet.color, dc:colorSet.dc, cls:'c-custom'});
  save();
  buildFilters();
  buildClientSelect();
  renderSettings();
  toast('✓ Cliente adicionado!');
}

function delClient(id) {
  clients = clients.filter(c=>c.id!==id);
  save();
  buildFilters();
  buildClientSelect();
  renderSettings();
  toast('Cliente removido');
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function updateProg() {
  const tasks = allTasks(activeMonth);
  const comp = tasks.filter(t=>done[t.id]).length;
  const pct = tasks.length>0?Math.round(comp/tasks.length*100):0;
  document.getElementById('pb').style.width=pct+'%';
}

// ── TOGGLE / DELETE ───────────────────────────────────────────────────────────
function toggle(id){
  done[id]=!done[id]; save();
  document.querySelectorAll(`[data-id="${id}"]`).forEach(c=>c.classList.toggle('done',!!done[id]));
  toast(done[id]?'✓ Concluída!':'Reaberta');
  updateProg();
  if(activeView==='report') renderReport();
}

function delTask(e,id){
  e.stopPropagation();
  custom=custom.filter(t=>t.id!==id);
  delete done[id]; save();
  renderView(); toast('Removido');
}

// ── MONTH NAV ─────────────────────────────────────────────────────────────────
function buildMonthNav() {
  const el = document.getElementById('monthNav');
  el.innerHTML = MONTHS_LIST.map((mo,i)=>
    `<button class="month-btn ${i===activeMonth?'active':''}" onclick="setMonth(${i})">${mo.label}</button>`
  ).join('');
}

function setMonth(i){
  activeMonth=i;
  buildMonthNav();
  renderView();
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
function buildFilters() {
  const el = document.getElementById('filters');
  let h=`<button class="fbtn ${filter==='all'?'active':''}" onclick="setFilter('all')">Todos</button>`;
  clients.forEach(c=>{
    h+=`<button class="fbtn ${filter===c.id?'active':''}" onclick="setFilter('${c.id}')">${c.name}</button>`;
  });
  h+=`<button class="fbtn ${filter==='custom'?'active':''}" onclick="setFilter('custom')">➕ Extras</button>`;
  el.innerHTML=h;
}

function setFilter(f){
  filter=f; buildFilters(); renderView();
}

// ── CLIENT SELECT ─────────────────────────────────────────────────────────────
function buildClientSelect() {
  const sel = document.getElementById('fClient');
  sel.innerHTML = clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('') +
    `<option value="custom">Outro</option>`;
}

// ── TABS ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    activeView=btn.dataset.view;
    document.getElementById('view-'+activeView).classList.add('active');
    const showFilters = activeView==='list'||activeView==='cal';
    document.getElementById('filters').style.display=showFilters?'flex':'none';
    document.getElementById('monthNav').style.display=activeView==='settings'?'none':'flex';
    renderView();
  });
});

function renderView(){
  if(activeView==='list') renderList();
  else if(activeView==='cal') renderCal();
  else if(activeView==='report') renderReport();
  else renderSettings();
}

// ── ADD MODAL ─────────────────────────────────────────────────────────────────
const ov=document.getElementById('overlay');
document.getElementById('fab').addEventListener('click',()=>{
  const {y,m}=MONTHS_LIST[activeMonth];
  document.getElementById('fDate').value=`${y}-${String(m+1).padStart(2,'0')}-01`;
  document.getElementById('fTipo').value='';
  document.getElementById('fPrazo').value='';
  ov.classList.add('open');
});
document.getElementById('mcancel').addEventListener('click',()=>ov.classList.remove('open'));
ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');});
document.getElementById('msave').addEventListener('click',()=>{
  const date=document.getElementById('fDate').value;
  const client=document.getElementById('fClient').value;
  const tipo=document.getElementById('fTipo').value.trim();
  const prazo=document.getElementById('fPrazo').value.trim();
  if(!date||!tipo){toast('Preencha a data e a tarefa!');return;}
  custom.push({id:'c'+Date.now(),date,client,tipo,prazo,preset:false});
  save(); ov.classList.remove('open');
  // Switch to correct month
  const td=new Date(date+'T12:00:00');
  const mi=MONTHS_LIST.findIndex(mo=>mo.y===td.getFullYear()&&mo.m===td.getMonth());
  if(mi>=0&&mi!==activeMonth){ activeMonth=mi; buildMonthNav(); }
  renderView(); toast('✓ Compromisso adicionado!');
});

// ── TOAST ─────────────────────────────────────────────────────────────────────
let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// Set current month as active
const now=new Date();
const curMi=MONTHS_LIST.findIndex(mo=>mo.y===now.getFullYear()&&mo.m===now.getMonth());
if(curMi>=0) activeMonth=curMi;

buildMonthNav();
buildFilters();
buildClientSelect();
renderView();
updateProg();
</script>
</body>
